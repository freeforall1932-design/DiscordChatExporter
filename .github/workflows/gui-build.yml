name: gui

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP: DiscordChatExporter.Cli

jobs:
  # Builds the CLI (with the embedded web interface) and exercises it end-to-end
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Build
        run: >
          dotnet build DiscordChatExporter.Cli
          -p:CSharpier_Bypass=true
          --configuration Release

      - name: Publish (linux-x64, self-contained)
        run: >
          dotnet publish DiscordChatExporter.Cli
          -p:CSharpier_Bypass=true
          --configuration Release
          --runtime linux-x64
          --self-contained
          --output ./publish

      - name: Show assets
        run: ls -la ./publish | head -30

      - name: Smoke test the web interface
        run: |
          set -o pipefail
          ./scripts/smoke-test-gui.sh ./publish/DiscordChatExporter.Cli 5155 2>&1 | tee smoke.log

      - name: Publish diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          for file in gui.log smoke.log info.json run.json raw-run.json error.json index.html; do
            [ -f "$file" ] && cp "$file" ci-diagnostics/ || true
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-diagnostics
          git commit -m "CI diagnostics for failed run"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-linux-x64
          path: ./publish/
          if-no-files-found: error

  # Applies the repository's C# formatting rules straight to the branch
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Format
        run: >
          dotnet build DiscordChatExporter.Cli
          -t:CSharpierFormat
          -p:CSharpier_Check=false
          --configuration Release

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Everything is already formatted."
            exit 0
          fi

          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply formatting"
          git push origin "HEAD:${{ github.ref_name }}"
